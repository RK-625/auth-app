services:
  # --- Database Service (MySQL) ---
  mysql:
    image: mysql:8.0
    container_name: auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: authapp
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306" # Mapped to 3307 to avoid conflict with local MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  # --- SMTP Testing Service (Mailpit) ---
  mailpit:
    image: axllent/mailpit
    container_name: auth-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

  # --- Backend Application (Spring Boot) ---
  auth-app:
    build: .
    container_name: auth-backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      # Database Overrides
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: user
      DATABASE_PASSWORD: password
      
      # SMTP Overrides (Routing to Mailpit)
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      
      # Security & JWT (Example defaults for local docker testing)
      JWT_SECRET: "9a4f43424d5152454d4c4a4c4b4a48474644534151574552545955494f504c4b4a484746445341"
      JWT_ISSUER: "auth-app-docker"
      JWT_ACCESS_TTL_SECONDS: 3600
      JWT_REFRESH_TTL_SECONDS: 86400
      JWT_REFRESH_COOKIE_NAME: "refresh_token"
      JWT_COOKIE_SECURE: "false"
      JWT_COOKIE_HTTP_ONLY: "true"
      JWT_COOKIE_SAME_SITE: "Strict"
      
      # App Settings
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: dev

volumes:
  mysql_data:
