# -----------------------------------------------------------------------------
# Authentication Microservice - Primary Configuration
# -----------------------------------------------------------------------------
# This is the base configuration file. In a professional production environment,
# most values here are placeholders that are injected via environment variables
# (e.g., from AWS Secrets Manager or Kubernetes ConfigMaps).
# -----------------------------------------------------------------------------

spring:
  application:
    name: auth-app
  profiles:
    # --- Profile Activation ---
    # In production, this should be set to 'prod' via -Dspring.profiles.active=prod.
    # Currently defaults to 'dev' to load local developer settings from application-dev.yml.
    active: dev

  # --- Mail Auto-Configuration ---
  # Adding these keys ensures that the 'JavaMailSender' bean is properly initialized
  # by Spring Boot's auto-configuration engine.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082

# -----------------------------------------------------------------------------
# RUNTIME OPTIMIZATIONS (JAVA 21+)
# -----------------------------------------------------------------------------
spring:
  threads:
    virtual:
      enabled: true

# -----------------------------------------------------------------------------
# APPLICATION VALIDATION RULES
# -----------------------------------------------------------------------------
app:
  validation:
    min-password-length: 6

# -----------------------------------------------------------------------------
# OBSERVABILITY & MONITORING (SPRING ACTUATOR)
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Expose core monitoring endpoints. Prometheus is used for Grafana dashboards.
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      # 'show-details' is restricted to prevent leaking internal system states.
      show-details: when_authorized
      roles: "ADMIN"
  info:
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true
