# -----------------------------------------------------------------------------
# Localization & Validation Resource Bundle
# -----------------------------------------------------------------------------
# This file centralizes all user-facing strings and error messages. 
# It is utilized by the MessageHelper and GlobalExceptionHandler to:
# 1. Prevent hardcoded strings in the business logic.
# 2. Support multi-language expansion (i18n).
# 3. Standardize 'Fail-Fast' validation messages.
# -----------------------------------------------------------------------------

# --- AUTHENTICATION & LOGIN ---
auth.login.invalid_credentials=Invalid Username or Password
auth.login.invalid_email=Invalid Email
auth.user.disabled=Your account is currently disabled. Please contact support.
auth.user.locked=Your account has been temporarily locked due to too many failed attempts. Please try again in {0}.
auth.user.not_found=No user was found with the provided email address.
auth.user.access_denied=You do not have the required permissions to perform this action.

# --- TOKEN LIFECYCLE ---
token.refresh.not_present=The refresh token is not present in the Body or Cookie.
token.refresh.invalid=The refresh token provided is invalid or malformed.
token.refresh.revoked=This refresh token has been revoked and can no longer be used.
token.refresh.expired=Your session has expired. Please login again.
token.refresh.user_mismatch=Security breach: Token does not belong to the authenticated user.
token.refresh.not_found_db=Session data is missing. Please re-authenticate.
token.refresh.version_mismatch=Your session was invalidated due to a recent account security change. Please log in again.

# --- USER & REGISTRATION ---
user.register.email_required=Email address is a required field.
user.register.email_invalid=Please provide a valid email format.
user.register.email_exists=An account with this email address already exists.
user.register.password_required=A password is required to create an account.
user.register.password_too_short=Password must be between 6 and 72 characters long.
user.profile.not_found=The requested user profile was not found.

# --- FORGET PASSWORD ---
auth.forget.email_required=Please enter your email address to receive a verification code.
auth.forget.email_not_found=If an account exists with that email, we will send a reset code.
auth.forget.otp_required=Verification code is mandatory.
auth.forget.otp_invalid=The code you entered is incorrect or has expired. Please try again.
auth.forget.token_required=Security handshake token is missing. Please restart the process.
auth.forget.success=Your password has been reset successfully. You can now login.

# --- ROLES ---
role.not_found=The required user role (ROLE_USER) was not found in the system.

# --- EXTERNAL INTEGRATIONS ---
external.github.error=GitHub authentication failed with status code: {0}
external.google.error=Google authentication failed. Please try again later.

# --- SYSTEM & VALIDATION ---
system.error.unexpected=An unexpected error occurred. Please try again.
system.error.unauthorized=Unauthorized access
system.resource.not_found=The requested resource could not be located.
system.validation.failure=One or more validation checks failed for your request.
system.error.too_many_requests=Too many requests. Please wait a moment and try again.
system.error.concurrency_conflict=A concurrent update was detected. Please refresh and try again.

# --- SIGNUP & VALIDATION ---
signup.validation.failure=Validation failed for the signup request. Please check your input.
signup.validation.token_required=Handshake verification token is required to finalize signup.

# --- OTP & RATE LIMITING ---
auth.otp.cooldown=Please wait at least 60 seconds before requesting a new verification code.
