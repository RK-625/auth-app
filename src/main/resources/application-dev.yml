server:
  port: 8083

## database configurations
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app_yt
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
#    hikari:
#      pool-name: HikariCP
#      max-lifetime: 1800000
#      validation-timeout: 1800000
#      idle-timeout: 600000
#      connection-timeout: 10000
#      maximum-pool-size: 5
#      leak-detection-threshold: 0
#      initialization-fail-timeout: -1

  #jpa and hibernate configurations
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  # --- EMAIL CONFIGURATION (Gmail Example) ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
        debug: true

### jwt settings here
  security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
              scope:
                - email
                - profile
                - openid
            github:
              client-id: ${GITHUB_CLIENT_ID}
              client-secret: ${GITHUB_CLIENT_SECRET}
              scope:
                - user:email
                - read:user
          provider:
            github:
              authorization-uri: https://github.com/login/oauth/authorize?prompt=consent

### jwt settings here
security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      acess-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS}
      refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME}
      cookie-secure: ${JWT_COOKIE_SECURE}
      cookie-http-only: ${JWT_COOKIE_HTTP_ONLY}
      cookie-same-site: ${JWT_COOKIE_SAME_SITE}
      cookie-domain: ${JWT_COOKIE_DOMAIN}
